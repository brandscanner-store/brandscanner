<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found - BrandScanner</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230a1f44'/><text x='50' y='75' font-family='sans-serif' font-size='70' font-weight='bold' fill='%23b3ff00' text-anchor='middle'>BS</text></svg>">
<style>
:root{--bg:#faf9f6;--navy:#0a1f44;--green:#b3ff00;--text:#0a1f44;--muted:#6b7280}
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center}
.wrap{padding:40px 20px}
h1{font-family:Georgia,serif;font-size:80px;margin:0;color:var(--navy);line-height:1}
h2{font-size:24px;margin:10px 0 20px;color:var(--navy)}
p{color:var(--muted);margin-bottom:30px;font-size:15px}
a{background:var(--navy);color:#fff;text-decoration:none;padding:14px 28px;border-radius:8px;font-weight:700;font-size:14px;display:inline-block;letter-spacing:1px;text-transform:uppercase;transition:all .2s}
a:hover{background:var(--green);color:var(--navy)}
</style>
</head>
<body>
<div class="wrap">
  <h1>404</h1>
  <h2>Page Not Found</h2>
  <p>Lagta hai ye page exist nahi karta. Aap wapas jaakar shopping continue kar sakte hain.</p>

</div>
