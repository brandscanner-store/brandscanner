<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrandScanner</title>
<style>
:root{--bg:#f6f6f4;--card:#ffffff;--text:#1a1a1a;--muted:#6b6b6b;--accent:#1f6f5c;--wa:#1faa59;--border:#e4e4df}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--card:#1d1d1d;--text:#f0f0f0;--muted:#a0a0a0;--accent:#4cc3a4;--wa:#25c26a;--border:#2c2c2c}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{padding:20px 16px 8px}
h1{margin:0;font-size:24px;letter-spacing:.3px}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.controls{display:flex;gap:8px;padding:8px 16px 16px;flex-wrap:wrap}
input,select{flex:1 1 140px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 16px 32px}
@media(min-width:720px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.thumb{aspect-ratio:1/1;background:var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.name{font-size:14px;line-height:1.3;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.code{color:var(--muted);font-size:12px}
.price{color:var(--accent);font-weight:700;font-size:18px}
.order{margin-top:auto;display:block;text-align:center;background:var(--wa);color:#fff;text-decoration:none;font-weight:600;font-size:14px;padding:10px;border-radius:10px}
.msg{padding:24px 16px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>BrandScanner</h1>
  <div class="sub" id="count">Loading...</div>
</header>
<div class="controls">
  <input id="q" type="search" placeholder="Search watches">
  <select id="sort">
    <option value="new">Newest</option>
    <option value="low">Price: low to high</option>
    <option value="high">Price: high to low</option>
  </select>
</div>
<div class="msg" id="msg"></div>
<div class="grid" id="grid"></div>

<script>
(function () {
  var WHATSAPP = '917990643295';
  var grid = document.getElementById('grid');
  var msg = document.getElementById('msg');
  var count = document.getElementById('count');
  var q = document.getElementById('q');
  var sortSel = document.getElementById('sort');
  var all = [];

  function formatPrice(v) {
    var n = Number(v);
    if (!isFinite(n)) return '';
    return '\u20B9' + n.toLocaleString('en-IN');
  }

  function imgSrc(p) {
    if (!p.image) return '';
    return p.image;
  }

  function orderLink(p) {
    var text = 'Hi BrandScanner, mujhe ye watch order karni hai:\n' +
      p.name + '\nCode: ' + p.code + '\nPrice: ' + formatPrice(p.price);
    return 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(text);
  }

  function card(p) {
    var el = document.createElement('div');
    el.className = 'card';

    var thumb = document.createElement('div');
    thumb.className = 'thumb';
    var src = imgSrc(p);
    if (src) {
      var img = document.createElement('img');
      img.loading = 'lazy';
      img.alt = p.name;
      img.referrerPolicy = 'no-referrer';
      img.onerror = function () {
        thumb.removeChild(img);
        thumb.textContent = 'No image';
      };
      img.src = src;
      thumb.appendChild(img);
    } else {
      thumb.textContent = 'No image';
    }
    el.appendChild(thumb);

    var info = document.createElement('div');
    info.className = 'info';

    var name = document.createElement('div');
    name.className = 'name';
    name.textContent = p.name;

    var code = document.createElement('div');
    code.className = 'code';
    code.textContent = 'Code: ' + p.code;

    var price = document.createElement('div');
    price.className = 'price';
    price.textContent = formatPrice(p.price);

    var order = document.createElement('a');
    order.className = 'order';
    order.target = '_blank';
    order.rel = 'noopener';
    order.href = orderLink(p);
    order.textContent = 'WhatsApp par order karo';

    info.appendChild(name);
    info.appendChild(code);
    info.appendChild(price);
    info.appendChild(order);
    el.appendChild(info);
    return el;
  }

  function render() {
    var term = q.value.trim().toLowerCase();
    var list = all.filter(function (p) {
      if (!term) return true;
      return p.name.toLowerCase().indexOf(term) !== -1 ||
        String(p.code).toLowerCase().indexOf(term) !== -1;
    });
    var mode = sortSel.value;
    if (mode === 'low') {
      list.sort(function (a, b) { return a.price - b.price; });
    } else if (mode === 'high') {
      list.sort(function (a, b) { return b.price - a.price; });
    }
    grid.innerHTML = '';
    list.forEach(function (p) { grid.appendChild(card(p)); });
    count.textContent = list.length + ' watches';
    msg.textContent = list.length ? '' : 'Abhi koi product nahi mila.';
  }

  fetch('catalog.json?v=' + Date.now(), { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (data) {
      var list = Array.isArray(data) ? data : (data && Array.isArray(data.products) ? data.products : []);
      all = list.filter(function (p) { return p && p.name && p.code && isFinite(Number(p.price)); });
      render();
    })
    .catch(function () {
      count.textContent = '';
      msg.textContent = 'Products jaldi aa rahe hain.';
    });

  q.addEventListener('input', render);
  sortSel.addEventListener('change', render);
})();
</script>
</body>
</html>
